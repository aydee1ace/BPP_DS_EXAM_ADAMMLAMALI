name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check application files
        run: |
          echo "Repository contents:"
          ls -la
          echo "Application folder contents:"
          ls -la data-science-assessment-prep
          echo "Source folder contents:"
          ls -la data-science-assessment-prep/src

      - name: Install dependencies
        working-directory: data-science-assessment-prep
        run: npm install

      - name: Build Vite application
        working-directory: data-science-assessment-prep
        run: npm run build

      - name: Verify completed build
        run: |
          test -f data-science-assessment-prep/dist/index.html
          echo "The built index.html file exists."
          ls -la data-science-assessment-prep/dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: data-science-assessment-prep/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
